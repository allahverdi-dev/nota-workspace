<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Nota — a private workspace for notes and ideas</title>
    <meta
      name="description"
      content="Nota is a local-first notes and personal knowledge workspace. Your notes stay on your device: no account, no server, no tracking."
    />
    <meta name="theme-color" content="#f9f9f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/brand/icon.svg" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/views.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <script>
      /* Resolve the theme before first paint so the app never flashes
         the wrong colours. Mirrors the preference written by storage.js. */
      (function () {
        try {
          var stored = localStorage.getItem('nota:theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>

    <div class="app" id="app" data-pane="list" data-sidebar="closed">
      <!-- ================= Sidebar ================= -->
      <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
        <div class="sidebar__head">
          <span class="brand">
            <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <use href="#i-brand" />
            </svg>
            <span class="brand__name">Nota</span>
          </span>
          <button type="button" class="icon-btn nav-toggle" id="sidebar-close" aria-label="Close navigation">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close" /></svg>
          </button>
        </div>

        <div class="sidebar__body" id="sidebar-body-wrap">
          <button type="button" class="btn btn--primary btn--block" id="new-note-button">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus" /></svg>
            <span>New note</span>
          </button>

          <button type="button" class="search-trigger" id="search-trigger">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search" /></svg>
            <span class="search-trigger__label">Quick search</span>
            <span class="palette__keys" id="search-trigger-keys"></span>
          </button>

          <nav id="sidebar-body" aria-label="Views and folders"></nav>
        </div>

        <div class="sidebar__foot">
          <p class="sidebar__privacy">
            <svg class="icon icon--sm" aria-hidden="true" focusable="false"><use href="#i-shield" /></svg>
            <span>Your notes stay on this device.</span>
          </p>
          <div class="u-row">
            <button type="button" class="nav-item" id="settings-button">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings" /></svg>
              <span class="nav-item__label">Settings</span>
            </button>
            <button type="button" class="icon-btn" id="theme-button" aria-label="Change theme" title="Change theme">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon" /></svg>
            </button>
          </div>
        </div>
      </aside>

      <button type="button" class="sidebar-scrim" id="sidebar-scrim" tabindex="-1" aria-hidden="true" hidden></button>

      <!-- ================= Workspace ================= -->
      <main class="workspace">
        <!-- Notes list -->
        <section class="list-pane" aria-label="Notes">
          <header class="list-pane__head" id="list-head"></header>

          <div class="search-bar" id="list-search" hidden>
            <svg class="icon icon--lg" aria-hidden="true" focusable="false"><use href="#i-search" /></svg>
            <input
              type="search"
              class="search-bar__input"
              id="list-search-input"
              placeholder="Search notes…"
              aria-label="Search notes"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="icon-btn" id="list-search-clear" aria-label="Clear search" hidden>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close" /></svg>
            </button>
          </div>

          <div class="list-pane__scroll" id="list-scroll">
            <p class="list-pane__meta" id="list-meta" aria-live="polite"></p>
            <div id="note-list"></div>
            <div class="empty-state" id="list-empty" hidden></div>
          </div>
        </section>

        <!-- Detail -->
        <section class="detail-pane" id="detail-pane" aria-label="Note">
          <!-- Editor -->
          <article class="editor" id="editor" hidden>
            <header class="editor__topbar">
              <button type="button" class="icon-btn pane-back" id="pane-back" aria-label="Back to notes">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-left" /></svg>
              </button>
              <nav class="breadcrumbs" id="editor-breadcrumbs" aria-label="Breadcrumb"></nav>
              <p class="save-status" id="save-status" data-state="idle">
                <span class="save-status__dot" aria-hidden="true"></span>
                <span class="save-status__text" id="save-status-text">Saved locally</span>
              </p>
              <div class="editor__actions" id="editor-actions"></div>
            </header>

            <div class="editor__banner" id="editor-banner" hidden></div>

            <div class="editor__toolbar" id="editor-toolbar" role="toolbar" aria-label="Formatting">
              <button type="button" class="icon-btn" data-format="heading" aria-pressed="false" aria-label="Heading" title="Heading">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-heading" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="subheading" aria-pressed="false" aria-label="Subheading" title="Subheading">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-subheading" /></svg>
              </button>
              <span class="editor__toolbar-sep" role="separator"></span>
              <button type="button" class="icon-btn" data-format="bold" aria-pressed="false" aria-label="Bold" title="Bold">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bold" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="italic" aria-pressed="false" aria-label="Italic" title="Italic">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-italic" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="code" aria-pressed="false" aria-label="Inline code" title="Inline code">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-code" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="link" aria-pressed="false" aria-label="Link" title="Link">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-link" /></svg>
              </button>
              <span class="editor__toolbar-sep" role="separator"></span>
              <button type="button" class="icon-btn" data-format="bulletList" aria-pressed="false" aria-label="Bulleted list" title="Bulleted list">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="numberedList" aria-pressed="false" aria-label="Numbered list" title="Numbered list">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list-ordered" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="checklist" aria-pressed="false" aria-label="Checklist" title="Checklist">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-checklist" /></svg>
              </button>
              <button type="button" class="icon-btn" data-format="quote" aria-pressed="false" aria-label="Quote" title="Quote">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-quote" /></svg>
              </button>
              <span class="editor__toolbar-sep" role="separator"></span>
              <button type="button" class="icon-btn" data-format="clear" aria-label="Clear formatting" title="Clear formatting">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eraser" /></svg>
              </button>
            </div>

            <div class="editor__scroll">
              <div class="editor__doc">
                <h1
                  class="editor__title"
                  id="editor-title"
                  contenteditable="true"
                  role="textbox"
                  aria-label="Note title"
                  data-placeholder="Untitled note"
                  spellcheck="false"
                ></h1>

                <div class="editor__meta" id="editor-meta"></div>
                <div class="editor__tags" id="editor-tags"></div>
                <hr class="editor__rule" />

                <div
                  class="editor__content"
                  id="editor-content"
                  contenteditable="true"
                  role="textbox"
                  aria-multiline="true"
                  aria-label="Note content"
                  data-placeholder="Start writing…"
                ></div>
              </div>
            </div>
          </article>

          <!-- Settings -->
          <section class="settings" id="settings-view" aria-label="Settings" hidden>
            <header class="editor__topbar">
              <button type="button" class="icon-btn pane-back" id="settings-back" aria-label="Back to notes">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-left" /></svg>
              </button>
              <span class="breadcrumbs"><span class="breadcrumbs__current">Settings</span></span>
            </header>
            <div class="settings__scroll">
              <div class="settings__doc" id="settings-body"></div>
            </div>
          </section>

          <!-- Nothing selected -->
          <div class="empty-state empty-state--fill" id="detail-empty"></div>
        </section>
      </main>
    </div>

    <input type="file" id="import-file-input" accept="application/json,.json" hidden />

    <div class="toast-region" id="toast-region"></div>
    <div class="visually-hidden" id="live-region" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <p style="padding: 2rem; max-width: 40ch; margin: 0 auto">
        Nota is a client-side application and needs JavaScript enabled. Nothing is
        sent anywhere — the code runs entirely in your browser.
      </p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
